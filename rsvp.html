<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAF8F5;
            --text-color: #333333;
            --accent-color: #7A1212; 
            --box-bg: #ffffff;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1, h2, h3 { font-family: 'Lora', serif; font-weight: 400; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        
        .back-link { color: var(--accent-color); text-decoration: none; font-weight: 600; font-size: 0.9em; }
        .back-link:hover { text-decoration: underline; }

        .lang-toggle button {
            background: none; border: 1px solid var(--accent-color);
            padding: 8px 16px; border-radius: 20px; cursor: pointer;
            color: var(--accent-color); font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }
        .lang-toggle button:hover { background: var(--accent-color); color: white; }

        header { margin-bottom: 40px; }
        h1 { font-size: 2.5em; margin: 10px 0; color: var(--accent-color); }

        .form-box {
            background: var(--box-bg); padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px; margin: 0 auto; text-align: left;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9em; }
        
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
    width: 100%; padding: 12px; border: 1px solid #ddd;
    border-radius: 5px; box-sizing: border-box; font-family: 'Montserrat', sans-serif;
}


        button.action-btn {
            width: 100%; color: black;
            border: none; padding: 15px; font-size: 1.1em; border-radius: 5px;
            cursor: pointer; font-family: 'Lora', serif; transition: background 0.3s;
        }
        button.action-btn:hover { background-color: #7A1212; color: white; }

        .member-rsvp-group { background: #f9f9f9; padding: 10px 15px; border-radius: 5px; border: 1px solid #eee; }
        .member-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #e0e0e0;
        }
        .member-row:last-child { border-bottom: none; }
        .member-name { font-weight: 600; font-size: 0.95em; }
        .radio-options { display: flex; gap: 15px; }
        .radio-options label { margin-bottom: 0; font-weight: 400; cursor: pointer; display: flex; align-items: center; gap: 5px;}

        .pt { display: none; } 
        #step2 { display: none; } 
        #loading { display: none; text-align: center; color: var(--accent-color); margin-top: 20px; font-style: italic; }
        #error-msg { display: none; color: #d9534f; margin-top: 15px; text-align: center; font-weight: 600; }
		
	.action-btn {
    /* 1. Removes the blue flash when you tap the button */
    -webkit-tap-highlight-color: transparent !important;

    /* 2. Forces iOS to use your red color instead of system blue */
    -webkit-appearance: none !important; 
    appearance: none !important;
	
	/* Ensure your red background is forced */
    background-color: #7A1212 !important;
        }
    </style>
	<!-- Favicon Link -->
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-link">
            <span class="en">← Back to Details</span>
            <span class="pt">← Voltar aos Detalhes</span>
        </a>
        <div class="lang-toggle">
            <button onclick="toggleLanguage()">
                <span class="en">Mudar para Português</span>
                <span class="pt">Switch to English</span>
            </button>
        </div>
    </div>

    <div class="container">
        <header>
            <h1 class="en">RSVP</h1>
            <h1 class="pt">Confirme a presença (RSVP)</h1>
        </header>

        <div id="step1" class="form-box">
            <p class="en" style="text-align: center; margin-bottom: 25px;">Please enter your full name</p>
            <p class="pt" style="text-align: center; margin-bottom: 25px;">Por favor, insira o seu nome completo</p>

            <form id="search-form" onsubmit="searchGuest(event)">
                <div class="form-group">
                    <label>
                        <span class="en">Full Name</span>
                        <span class="pt">Nome Completo</span>
                    </label>
                    <input type="text" id="searchName" required>
                </div>
                <button type="submit" class="action-btn">
                    <span class="en">Search Guest List</span>
                    <span class="pt">Pesquisar</span>
                </button>
            </form>

            <div id="loading">
                <span class="en">Searching guest list...</span>
                <span class="pt">Pesquisar na lista de convidados...</span>
            </div>
            <div id="error-msg">
                <span class="en">We couldn't find your name</span>
                <span class="pt">Não encontramos o seu nome</span>
            </div>
        </div>

        <div id="step2" class="form-box">
            <form id="rsvp-form" method="POST" onsubmit="return prepareSubmit()">
                
                <input type="hidden" id="hidden-party-names" name="partyNames">

                <div class="form-group">
                    <label>
                        <span class="en">Please respond for each guest:</span>
                        <span class="pt">Por favor, responda para cada convidado:</span>
                    </label>
                    <div id="party-members-container" class="member-rsvp-group"></div>
                </div>

                <div class="form-group">
                    <label>
                        <span class="en">Phone number (for updates)</span>
                        <span class="pt">Número de telefone (para atualizações)</span>
                    </label>
                    <!-- Changed type to 'tel' and name to 'phone' -->
					<input type="tel" name="phone">

                </div>

                <div class="form-group">
                    <label>
                        <span class="en">Dietary Requirements / Allergies</span>
                        <span class="pt">Restrições Alimentares / Mensagem para os noivos</span>
                    </label>
                    <textarea name="message" rows="4"></textarea>
                </div>

                <button type="submit" class="action-btn">
                    <span class="en">Send RSVP</span>
                    <span class="pt">Enviar Confirmação</span>
                </button>
            </form>
			<img class="header-image reveal active" src="favicon.png" style="display: block; margin: 40px auto 0 auto; height: 50px; opacity: 0.5;">
			<p style="letter-spacing: 3px; font-size: 0.6em; color: #888; text-transform: uppercase;">Made with love by Patricia and andre</p>
        </div>
    </div>

    <script>
        // ==========================================
        // PASTE YOUR GOOGLE WEB APP URL RIGHT HERE:
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKZf49DjQ8f_ItnmQ2bVtKs-3fpV8a0zjjxx9aLrUqGrhrWDYIYMHdg3zErZZrOfR2Ww/exec"; 

        // --- Smart Language Logic (Memory) ---
        let currentLang = localStorage.getItem('weddingLang') || (navigator.language.toLowerCase().includes('pt') ? 'pt' : 'en');

        function setLanguage(lang) {
            document.querySelectorAll('.en').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.pt').forEach(el => el.style.display = 'none');
            
            document.querySelectorAll(`.${lang}`).forEach(el => {
                el.style.display = el.tagName === 'SPAN' ? 'inline' : 'block';
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'pt' : 'en';
            localStorage.setItem('weddingLang', currentLang); 
            setLanguage(currentLang);
        }

        setLanguage(currentLang); 

        // --- Step 1: Search Logic ---
        async function searchGuest(event) {
            event.preventDefault();
            const fullName = document.getElementById('searchName').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?name=${encodeURIComponent(fullName)}`);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.found) {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    
                    const partyMembers = data.party.split(',');
                    const container = document.getElementById('party-members-container');
                    container.innerHTML = ''; 
                    
                    partyMembers.forEach((member, index) => {
                        const name = member.trim();
                        if (name) {
                            container.innerHTML += `
                                <div class="member-row">
                                    <span class="member-name">${name}</span>
                                    <div class="radio-options">
                                        <label>
                                            <input type="radio" name="rsvp_${index}" value="Yes" required> 
                                            <span class="en">Yes</span><span class="pt">Sim</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="rsvp_${index}" value="No" required> 
                                            <span class="en">No</span><span class="pt">Não</span>
                                        </label>
                                    </div>
                                </div>
                            `;
                        }
                    });
                    
                    setLanguage(currentLang);
                    document.getElementById('rsvp-form').action = GOOGLE_SCRIPT_URL;

                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong connecting to the guest list. Please try again.");
                document.getElementById('loading').style.display = 'none';
            }
        }

        // --- Step 2: Form Submit Logic ---
        function prepareSubmit() {
            const memberRows = document.querySelectorAll('.member-row');
            let results = [];
            
            memberRows.forEach((row, index) => {
                const name = row.querySelector('.member-name').innerText;
                const checkedRadio = row.querySelector(`input[name="rsvp_${index}"]:checked`);
                const answer = checkedRadio ? checkedRadio.value : "No Answer";
                
                results.push(`${name}: ${answer}`);
            });
            
            document.getElementById('hidden-party-names').value = results.join(' | ');
            return true;
        }
    </script>
</body>
</html>
